  <!-- Hapus duplikasi auth.js; pakai satu include dengan defer -->
  <script src="scripts/auth.js" defer></script>

  <!-- Handler login: tambahkan ini jika belum ada di scripts/auth.js -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('loginForm');
    const authMessage = document.getElementById('authMessage');

    if (!form) return;

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // <-- "command" utama: cegah submit default

      // ambil nilai
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // validasi sederhana
      if (!username || !password) {
        authMessage.style.display = 'block';
        authMessage.textContent = 'Isi semua field terlebih dahulu.';
        return;
      }

      // tampilkan loading / disable tombol (opsional)
      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Memproses...';
      }

      try {
        // contoh request ke backend (ubah URL sesuai API-mu)
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (res.ok) {
          // sukses — contoh redirect ke dashboard
          authMessage.style.display = 'block';
          authMessage.textContent = 'Login berhasil — mengalihkan...';
          // tunggu singkat supaya user lihat pesan, lalu redirect
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 600);
        } else {
          // ambil pesan error dari backend (jika ada)
          let data;
          try { data = await res.json(); } catch { data = null; }
          authMessage.style.display = 'block';
          authMessage.textContent = (data && data.message) ? data.message : 'Login gagal. Periksa username/password.';
        }
      } catch (err) {
        console.error(err);
        authMessage.style.display = 'block';
        authMessage.textContent = 'Terjadi kesalahan koneksi. Silakan coba lagi.';
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      }
    });
  });
  </script>

</body>
</html>
