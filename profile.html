<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile — MalibuShop</title>
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/profile.css">
  <link rel="stylesheet" href="styles/footer.css">
  <link rel="stylesheet" href="assets/css/ecommerce.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container profile-container">
    <h1>Profil Saya</h1>

    <div class="profile-card">
      <!-- AVATAR SECTION (HANYA SATU) -->
      <div class="avatar-section">
        <img id="profile-avatar" src="assets/default-avatar.svg" alt="Avatar">
        <input type="file" id="avatar-input" accept="image/*">
        <button id="reset-avatar" class="btn">Reset Avatar</button>
      </div>

      <!-- FORM -->
      <div class="profile-form">
        <label>Nama Lengkap</label>
        <input type="text" id="fullname">

        <label>Username</label>
        <input type="text" id="username">

        <label>Alamat</label>
        <input type="text" id="address">

        <label>No. Telepon</label>
        <input type="tel" id="phone">

        <button id="save-profile" class="btn primary">Simpan Profil</button>
      </div>
    </div>
  </div>

  <script src="scripts/profile.js"></script>

  <div id="footer-placeholder">
    <script src="scripts/header.js"></script>
    <script src="scripts/cart.js"></script>
  </div>
</body>
</html>
