<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Produk</title><link rel="stylesheet" href="assets/css/ecommerce.css"></head><body>
<div id="header-placeholder"></div>
<div class="container" style="padding-top:20px">
  <a href="products.html" style="text-decoration:none;color:var(--muted)">← Kembali ke daftar</a>
  <div class="card" style="margin-top:12px;display:grid;grid-template-columns:1fr 420px;gap:24px;align-items:start">
    <div>
      <div class="card" id="gallery" style="padding:18px">
        <img id="main-image" src="" alt="Gambar produk" style="width:100%;height:420px;object-fit:cover;border-radius:10px;margin-bottom:12px">
        <div id="thumbnails" style="display:flex;gap:10px"></div>
      </div>
      <div class="card" style="margin-top:16px;padding:18px">
        <h3>Deskripsi Produk</h3>
        <p id="product-desc" class="text-muted"></p>
      </div>
    </div>
    <div class="card" style="padding:18px">
      <h2 id="product-title"></h2>
      <div class="price" id="product-price" style="color: #4e4e4e;font-weight:800;font-size:20px;margin-bottom:8px"></div>
      <div style="margin-bottom:12px">
        <label for="variant">Pilih Varian:</label><br>
        <select id="variant" style="margin-top:6px;padding:6px 8px;border-radius:8px;border:1px solid #e5e7eb">
          <option>Standar</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <button class="btn secondary small" id="qty-decr">-</button>
        <input id="qty-input" type="number" value="1" min="1" style="width:64px;text-align:center;padding:8px;border-radius:8px;border:1px solid #e5e7eb">
        <button class="btn secondary small" id="qty-incr">+</button>
      </div>
      <div class="actions" style="margin-bottom:12px">
        <button class="btn add-cart" id="add-to-cart">Add to Cart</button>
        <button class="btn primary" id="buy-now">Buy Now</button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost small" id="save-wishlist">♡ Save</button>
        <button class="btn ghost small" id="share-btn">Share</button>
      </div>
    </div>
  </div>
  <div id="reviews" style="margin-top:22px">
    <h3>Ulasan</h3>
    <div id="reviews-list" class="card" style="padding:18px">Belum ada ulasan.</div>
    <div style="margin-top:12px">
      <h4>Tulis Ulasan</h4>
      <textarea id="review-text" placeholder="Tulis ulasan Anda di sini..." style="width:100%;min-height:120px;padding:12px;border-radius:8px;border:1px solid #e5e7eb"></textarea>
      <div style="margin-top:10px"><button class="btn" id="submit-review">Kirim Ulasan</button></div>
    </div>
  </div>
</div>
<div id="footer-placeholder"></div>
<script src="scripts/header.js"></script>
<script src="scripts/products.js"></script>
<script src="scripts/product-details.js"></script>
<script src="scripts/cart.js"></script>
</body></html>
